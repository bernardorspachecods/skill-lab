[project]
name = "context-lab-target"
version = "0.1.0"
description = "Synthetic project and task-management application."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "packages/core/src",
    "packages/storage/src",
    "apps/api/src",
    "apps/worker/src",
]
testpaths = [
    "packages/core/tests",
    "packages/storage/tests",
    "apps/api/tests",
    "apps/worker/tests",
]

[tool.ruff]
line-length = 88
target-version = "py312"
