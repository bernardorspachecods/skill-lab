[project]
name = "context-lab-harness"
version = "0.1.0"
description = "Harness for evaluating the context-lab target repository."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py312"
