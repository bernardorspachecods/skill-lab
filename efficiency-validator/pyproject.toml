[project]
name = "llm-efficiency-validator"
version = "0.1.0"
description = "Reusable capture, quality, comparison, and reporting for LLM runs."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
    "src",
]
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py312"
